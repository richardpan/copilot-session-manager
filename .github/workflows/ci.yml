name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, format, test
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      - name: Detect solution
        id: detect
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Recurse -Filter *.sln -ErrorAction SilentlyContinue | Select-Object -First 1
          $csproj = Get-ChildItem -Recurse -Filter *.csproj -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sln) {
            "target=$($sln.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "has_project=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Found solution: $($sln.FullName)"
          } elseif ($csproj) {
            "target=$($csproj.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "has_project=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Found project: $($csproj.FullName)"
          } else {
            "has_project=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "::notice::No .sln or .csproj found yet. Skipping build/test/format steps."
          }

      - name: Restore
        if: steps.detect.outputs.has_project == 'true'
        run: dotnet restore "${{ steps.detect.outputs.target }}"

      - name: Verify formatting
        if: steps.detect.outputs.has_project == 'true'
        run: dotnet format "${{ steps.detect.outputs.target }}" --verify-no-changes --no-restore

      - name: Build
        if: steps.detect.outputs.has_project == 'true'
        run: dotnet build "${{ steps.detect.outputs.target }}" --configuration Release --no-restore /warnaserror

      - name: Test (with coverage)
        if: steps.detect.outputs.has_project == 'true'
        run: |
          dotnet test "${{ steps.detect.outputs.target }}" `
            --configuration Release `
            --no-build `
            --logger "trx;LogFileName=test-results.trx" `
            --collect:"XPlat Code Coverage" `
            --settings coverlet.runsettings `
            --results-directory ./TestResults

      - name: Enforce minimum Core coverage
        if: steps.detect.outputs.has_project == 'true'
        shell: pwsh
        env:
          MIN_CORE_LINE_COVERAGE: '0.83'
        run: |
          $threshold = [double]$env:MIN_CORE_LINE_COVERAGE
          $reports = Get-ChildItem -Recurse -Path ./TestResults -Filter coverage.cobertura.xml -ErrorAction SilentlyContinue
          if (-not $reports -or $reports.Count -eq 0) {
            Write-Error "No coverage.cobertura.xml found under ./TestResults; coverage gate cannot run."
            exit 1
          }
          # The same package can appear in multiple cobertura reports because every
          # test assembly emits its own report. Take the highest observed line-rate
          # for CopilotSessionManager.Core (i.e. the Core.Tests project's view) and
          # gate on that.
          $bestRate = -1.0
          foreach ($file in $reports) {
            [xml]$xml = Get-Content $file.FullName
            foreach ($pkg in $xml.coverage.packages.package) {
              if ($pkg.name -eq 'CopilotSessionManager.Core') {
                $rate = [double]$pkg.'line-rate'
                Write-Host "  $($file.FullName) -> $([math]::Round($rate * 100, 2))%"
                if ($rate -gt $bestRate) { $bestRate = $rate }
              }
            }
          }
          if ($bestRate -lt 0) {
            Write-Error "Did not find a 'CopilotSessionManager.Core' package in any cobertura report; cannot enforce Core coverage."
            exit 1
          }
          $pct = [math]::Round($bestRate * 100, 2)
          $minPct = [math]::Round($threshold * 100, 2)
          Write-Host "CopilotSessionManager.Core line coverage: $pct% (threshold: $minPct%)"
          if ($bestRate -lt $threshold) {
            Write-Error "Core line coverage $pct% is below the required $minPct% floor. See coverlet.runsettings and docs/manual-tests.md for what is intentionally excluded."
            exit 1
          }

      - name: Upload test results
        if: always() && steps.detect.outputs.has_project == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

      - name: Generate coverage report
        if: steps.detect.outputs.has_project == 'true'
        uses: danielpalme/ReportGenerator-GitHub-Action@5.4.1
        with:
          reports: '**/coverage.cobertura.xml'
          targetdir: 'coverage-report'
          reporttypes: 'MarkdownSummary;Cobertura'
          verbosity: 'Warning'

      - name: Add coverage to job summary
        if: steps.detect.outputs.has_project == 'true' && hashFiles('coverage-report/Summary.md') != ''
        shell: pwsh
        run: Get-Content coverage-report/Summary.md | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && steps.detect.outputs.has_project == 'true' && hashFiles('coverage-report/Summary.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: coverage-report/Summary.md
          recreate: true
