name: Bug report
description: Report something that's broken or behaving incorrectly
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much
        detail as you can — it helps us reproduce and fix the issue faster.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of the bug.
      placeholder: When I click X, the app does Y instead of Z.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the bug.
      value: |
        1. Open the app
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: I expected ...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: Instead, ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: |
        Attach relevant logs from `%LOCALAPPDATA%\CopilotSessionManager\logs\`,
        or screenshots / screen recordings. **Please redact any sensitive content.**
      render: shell

  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: e.g. 0.1.0 or git sha
    validations:
      required: true

  - type: input
    id: copilot-version
    attributes:
      label: Copilot CLI version
      description: Run `copilot --version`
      placeholder: e.g. 1.0.43

  - type: input
    id: os
    attributes:
      label: Windows version
      description: Run `winver` or `[Environment]::OSVersion.Version`
      placeholder: e.g. Windows 11 23H2 (build 22631)
    validations:
      required: true

  - type: input
    id: dotnet
    attributes:
      label: .NET runtime version
      description: Run `dotnet --info`
      placeholder: e.g. 8.0.21

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Workarounds tried, related issues, hypotheses, etc.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues and didn't find a duplicate
          required: true
        - label: I have redacted any sensitive data (prompts, tokens, file paths)
          required: true
