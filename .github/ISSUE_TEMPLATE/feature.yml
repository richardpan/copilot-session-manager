name: Feature request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe the problem first, then
        the proposal. We're more likely to act on requests rooted in concrete
        problems than abstract wishlists.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain point or workflow gap motivates this feature?
      placeholder: When I'm doing X, I have to manually Y because the app doesn't ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like the app to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they fall short.

  - type: dropdown
    id: target
    attributes:
      label: Target milestone (your suggestion)
      options:
        - "V1 (MVP)"
        - "V2 (post-MVP)"
        - "Later / undecided"
      default: 2

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, prior art from other tools, related issues, etc.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues and didn't find a duplicate
          required: true
